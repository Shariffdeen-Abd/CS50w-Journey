<!DOCTYPE html>
<!--PSEUDO CLASS CSS SELECTOR-->
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <head>
        <title>Hover</title>
        <style>
            button{
                width: 140px;
                height: 50px;
                font-size: 24px;
                background-color: green;
                font-family: sans-serif;
            }

            button:hover  {
                background-color: orange;
            }
        </style>
    </head>
    <body>
        <button>Click Me</button>
    </body>
</html>
