<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Responsive Design</title>
        <style>
            @media (min-width: 1000px)/*If it's 600px or anything larger, go ahead and display color red*/ {
                body {
                    background-color: red;
                }
            }
            
            @media (max-width: 999px) /*If it's 599px or fewer, go ahead and display color blue*/ {
                body {
                    background-color: blue;
                }
            }
        </style>
    </head>
    <body>
       <h1>Welcome to My Web Page!</h1>
    </body>
</html>
